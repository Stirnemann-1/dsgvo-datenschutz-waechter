name: Bauen und testen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Kompilieren
        run: swift build -c release
      - name: Selbsttest
        run: .build/release/Selbsttest

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Kompilieren
        run: swift build -c release --product DatenschutzWaechterWindows
      - name: Selbsttest
        run: swift run -c release Selbsttest

      - name: Paket schnüren
        shell: pwsh
        run: |
          $bin = (swift build -c release --show-bin-path).Trim()
          $ziel = "paket\DSGVO Datenschutz Waechter"
          New-Item -ItemType Directory -Force $ziel | Out-Null
          Copy-Item "$bin\DatenschutzWaechterWindows.exe" "$ziel\DSGVO Datenschutz Waechter.exe"
          Copy-Item einstellungen.json $ziel
          Copy-Item README-Windows.md "$ziel\LIESMICH.md"
          Copy-Item LICENSE "$ziel\LIZENZ.txt"
          # Swift-Laufzeit (DLLs) mitliefern, damit auf dem Ziel-PC nichts installiert werden muss
          $laufzeit = Split-Path (where.exe swiftCore.dll | Select-Object -First 1)
          Write-Host "Swift-Laufzeit: $laufzeit"
          Copy-Item "$laufzeit\*.dll" $ziel
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (Test-Path "C:\Windows\System32\$dll") { Copy-Item "C:\Windows\System32\$dll" $ziel }
          }
          Get-ChildItem $ziel | Format-Table Name, Length

      - name: Paket prüfen (ohne installiertes Swift)
        shell: pwsh
        run: |
          $exe = Resolve-Path "paket\DSGVO Datenschutz Waechter\DSGVO Datenschutz Waechter.exe"
          $bericht = Join-Path $env:RUNNER_TEMP "bericht.txt"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath $exe -ArgumentList "--pruefen", $bericht -Wait -PassThru
          if (Test-Path $bericht) { Get-Content $bericht }
          Write-Host "Rückgabewert: $($p.ExitCode)"
          if ($p.ExitCode -eq 2) { Write-Host "::warning::Zwischenablage auf dem Build-Rechner nicht verfügbar" }
          elseif ($p.ExitCode -ne 0) { exit 1 }

      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DSGVO-Datenschutz-Waechter-Windows
          path: paket

      - name: Release veröffentlichen (einmal pro Version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION).Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag existiert bereits – für ein neues Release VERSION erhöhen."; exit 0 }
          Compress-Archive -Path "paket\DSGVO Datenschutz Waechter" -DestinationPath "DSGVO-Datenschutz-Waechter-Windows.zip"
          $notizen = @"
          **Windows:** ``DSGVO-Datenschutz-Waechter-Windows.zip`` herunterladen, entpacken, Ordner an einen festen Ort verschieben und ``DSGVO Datenschutz Waechter.exe`` starten. Meldet Windows «Der Computer wurde durch Windows geschützt»: «Weitere Informationen» → «Trotzdem ausführen». Anleitung: README-Windows.md

          **macOS:** Quellcode herunterladen und ``bash bauen.sh`` ausführen. Anleitung: README.md

          Ersetzt beim Kopieren Namen, Adressen, E-Mails usw. durch Platzhalter und fügt sie mit Strg+Alt+V bzw. ⌃⌥V wieder ein. Läuft lokal, ohne Cloud.
          "@
          gh release create $tag "DSGVO-Datenschutz-Waechter-Windows.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DSGVO Datenschutz Wächter $version" --notes $notizen
          exit 0
    permissions:
      contents: write
